name: Health Check
 
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:      # allows manual run from the Actions tab
 
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
   - name: Run health check
        run: |
          chmod +x scripts/health_check.sh
          ./scripts/health_check.sh
